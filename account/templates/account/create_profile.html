{% extends 'base2.html' %}

{% block title %}Crear Perfil{% endblock %}

{% block content %}
<main class="container my-4" role="main">
  <h2 id="form-title" class="mb-4 text-primary">Crear perfil</h2>

  <form method="post" enctype="multipart/form-data" aria-labelledby="form-title">
    {% csrf_token %}
    
    {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">
          {{ field.label }}
        </label>
        {{ field }}
        {% if field.errors %}
          <div id="{{ field.id_for_label }}-error" class="text-danger small" aria-live="polite">
            {{ field.errors|striptags }}
          </div>
        {% endif %}
      </div>
    {% endfor %}

    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Crear</button>
      <a href="{% url 'cv_panel' %}" class="btn btn-secondary ms-2" role="button">Cancelar</a>
    </div>
  </form>
</main>
{% endblock %}
