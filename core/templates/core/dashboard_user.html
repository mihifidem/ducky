{% extends 'base2.html' %}

{% block title %}Dashboard Usuario{% endblock %}

{% block content %}
<div class="container my-5">

  <!-- Tarjeta de bienvenida -->
  <div class="card shadow-lg border-0 mb-4">
    <div class="card-body bg-primary text-white rounded-3">
      <h1 class="h3 mb-3">
        <span class="material-icons align-middle me-2"></span>
        Estás en el Dashboard de Usuario
      </h1>
      <p class="mb-0">
        Bienvenido, <strong>{{ user.username }}</strong>.  
        Aquí puedes ver y gestionar tus <span class="fw-bold">DuckyTools</span>.
      </p>
    </div>
  </div>

<!-- Botón principal -->
<div class="text-center">
  <a href="{% url 'cv_panel' %}" class="btn btn-lg btn-outline-primary px-4 py-2 shadow-sm d-inline-flex align-items-center gap-2">
    <span class="material-icons">manage_accounts</span>
    Gestionar Mi Perfil
  </a>
</div>


</div>
{% endblock %}
