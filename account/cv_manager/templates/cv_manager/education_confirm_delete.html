{% extends 'base2.html' %}

{% block title %}Eliminar Educación{% endblock %}

{% block content %}

<main class="container mt-4" role="main">
  <div class="card border-danger" role="alertdialog" aria-labelledby="delete-edu-title">
    <div class="card-header bg-danger text-white">
      <h2 id="delete-edu-title" class="mb-0">¿Estás seguro que deseas eliminar esta educación?</h2>
    </div>
    <div class="card-body">
      <p class="lead" role="alert" aria-live="assertive">
        Esta acción eliminará permanentemente la educación <strong>"{{ education.title }}"</strong> en <strong>{{ education.institution }}</strong>.
      </p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'education_list' %}" class="btn btn-secondary ms-2" role="button">Cancelar</a>
      </form>
    </div>
  </div>
</main>

{% endblock %}
