{% extends 'base2.html' %}

{% block title %}Confirmar Eliminar idioma{% endblock %}

{% block content %}
<h2>Eliminar Idioma</h2>

<p>¿Estás seguro que deseas eliminar el idioma <strong>{{ language.language.name }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'language_list' %}" class="btn btn-secondary ms-2">Cancelar</a>
</form>
{% endblock %}
