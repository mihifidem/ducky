{% extends 'base2.html' %}
{% load crispy_forms_tags %}
{% load static %}
 {%block title_modul%}
 {%endblock%}
{% block content %}
<div class="container col-12">
   
<div class="app">
    <!-- begin app-wrap -->
    <div class="app-wrap">
        <!-- begin pre-loader -->
        <div class="loader">
            <div class="h-100 d-flex justify-content-center">
                <div class="align-self-center">
                    <img src="{% static '/static/img/loader/loader.svg' %}" alt="loader">
                </div>
            </div>
        </div>
        <!-- end pre-loader -->
       
        <!--start login contant-->
        <div class="app-contant">
            <div class="bg-white">
                <div class="container-fluid p-0">
                    <div class="row no-gutters">
                        <div class="col-sm-6 col-lg-5 col-xxl-3 align-self-center order-2 order-sm-1">
                            <div class="d-flex align-items-center h-100-vh">
                                <div class="login p-50">
                                    <h1 class="mb-2">We Are Duckyers</h1>
                                    <p>Welcome back, please login to your account.</p>

                                    <!-- Formulario Django funcional -->
                                    <form method="post" action="{% url 'login' %}?next=/dashboard/" class="mt-3 mt-sm-5">
                                        {% csrf_token %}
                                        {{ form|crispy }}
                                        <div class="col-12 mt-3">
                                            <button type="submit" class="btn btn-success btn-block">Enter</button>
                                        </div>
                                    </form>

                                    <div class="col-12 mt-3">
                                        <p>I don't have an account <a href="{% url 'register' %}">Register</a></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6 col-xxl-9 col-lg-7 bg-gradient o-hidden order-1 order-sm-2">
                            <div class="row align-items-center h-100">
                                <div class="col-7 mx-auto ">
                                    <img class="img-fluid" src="{% static 'img/ducky/login.png' %}" alt="" >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--end login contant-->
    </div>
    <!-- end app-wrap -->
</div>
</div>

<!-- end app -->
{% endblock %}
